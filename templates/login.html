<!DOCTYPE html>
<html lang="pt-BR" data-theme-preference="{{ session.get('tema_usuario', 'system') }}" data-authenticated="{{ 'true' if session.get('usuario_id') else 'false' }}" style="--accent: {{ session.get('cor_botao', '#007aff') }}; --button-text: {{ session.get('cor_botao_texto', '#ffffff') }};">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Acesso ao inventário | Imobilizado QR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261028-institucional3') }}">
    <script src="{{ url_for('static', filename='app.js', v='20261028-security1') }}" defer></script>
</head>
<body>
<main class="container tela-acesso">
    <div class="topbar topbar-login">
        <span></span>
        <button class="theme-toggle" type="button" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg>
            <span>Usar modo escuro</span>
        </button>
    </div>
    <header class="cabecalho cabecalho-acesso">
        <span class="marca-inventario" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
                <path d="M5 5h9v9H5zM18 5h9v9h-9zM5 18h9v9H5z"/>
                <path d="M19 19h3v3h-3zM27 18v4h-4M18 27h4M27 25v2"/>
            </svg>
        </span>
        <div>
            <span class="subtitulo">ACESSO AO INVENTÁRIO</span>
            <h1>Imobilizado QR</h1>
            <p>Entre com sua conta para acessar o inventário.</p>
        </div>
    </header>
    <div class="notificacoes" aria-live="polite">
        {% for mensagem in get_flashed_messages() %}
            <div class="notificacao" role="status"><span>{{ mensagem }}</span></div>
        {% endfor %}
    </div>
    <section class="card">
        <form action="{{ url_for('login') }}" method="POST" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" autocomplete="username" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>
        <p class="ajuda">Ainda não tem uma conta?</p>
        <a class="botao-link botao-secundario" href="{{ url_for('criar_conta') }}">Criar conta e senha</a>
        <p class="ajuda">Esqueceu sua senha? <a href="{{ url_for('recuperar_senha') }}">Recuperar acesso</a></p>
    </section>
</main>
</body>
</html>
